services:
  redis:
    image: redis:7.2-alpine
    container_name: taskflow_queue
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: taskflow_db
    environment:
      POSTGRES_USER: task_admin
      POSTGRES_PASSWORD: SecurePassword123
      POSTGRES_DB: taskflow_history
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_admin -d taskflow_history"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: taskflow_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://task_admin:SecurePassword123@postgres:5432/taskflow_history
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: taskflow_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://task_admin:SecurePassword123@postgres:5432/taskflow_history
      REDIS_URL: redis://redis:6379/0
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

  # The Metrics Database
  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  # The Visual Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: taskflow_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
